<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roommate Expenses & Shared Wallet | React Web App</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#EEF2FF',
              100: '#E0E7FF',
              400: '#818CF8',
              500: '#6366F1',
              600: '#4F46E5',
              700: '#4338CA',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & Babel for JSX -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase App & Firestore Compat SDKs for Real-Time Multi-Device Sync -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #090D16;
      color: #F8FAFC;
      -webkit-tap-highlight-color: transparent;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090D16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    @keyframes scanline {
      0% { top: 0%; opacity: 0.8; }
      50% { opacity: 1; }
      100% { top: 100%; opacity: 0.8; }
    }
    .scanner-line {
      animation: scanline 2.2s ease-in-out infinite alternate;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center bg-[#090D16] text-slate-100 selection:bg-indigo-500 selection:text-white">

  <!-- React Root Element -->
  <div id="root" class="w-full max-w-xl flex flex-col min-h-screen pb-24"></div>

  <!-- React Application Source Code -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Default Seed Data
    const INITIAL_ROOMMATES = [
      { id: "1", name: "Vinod Kumar", email: "uvinodkumar614@gmail.com", phone: "+91 98765 43210", isAdmin: true, pin: "1234", color: "#6366F1", avatarLetter: "V" },
      { id: "2", name: "Alex Chen", email: "alex.chen@example.com", phone: "+91 98765 43211", isAdmin: false, pin: "1234", color: "#10B981", avatarLetter: "A" },
      { id: "3", name: "Jordan Smith", email: "jordan.s@example.com", phone: "+91 98765 43212", isAdmin: false, pin: "1234", color: "#F59E0B", avatarLetter: "J" },
      { id: "4", name: "Sarah Miller", email: "sarah.m@example.com", phone: "+91 98765 43213", isAdmin: false, pin: "1234", color: "#EC4899", avatarLetter: "S" }
    ];

    const INITIAL_TRANSACTIONS = [
      {
        id: "tx-1",
        title: "Supermarket Monthly Groceries & Supplies",
        amount: 2850.00,
        category: "Groceries",
        isRoomExpense: true,
        isSettled: false,
        approvalStatus: "APPROVED",
        paidById: "1",
        paidByName: "Vinod Kumar",
        date: "Today, 10:45 AM",
        note: "Shared snacks, oil, pantry items"
      },
      {
        id: "tx-2",
        title: "High-Speed Fiber Internet",
        amount: 799.00,
        category: "Utilities",
        isRoomExpense: true,
        isSettled: false,
        approvalStatus: "APPROVED",
        paidById: "2",
        paidByName: "Alex Chen",
        date: "Yesterday, 4:20 PM",
        note: "Monthly bill 1Gbps"
      },
      {
        id: "tx-3",
        title: "Late Night Swiggy/Zomato Delivery",
        amount: 450.00,
        category: "Personal Spend",
        isRoomExpense: false,
        isSettled: false,
        approvalStatus: "PENDING",
        paidById: "3",
        paidByName: "Jordan Smith",
        date: "2 days ago",
        note: "Personal food order debited"
      },
      {
        id: "tx-4",
        title: "Kitchen Cleaning Supplies & Detergent",
        amount: 520.00,
        category: "Household",
        isRoomExpense: true,
        isSettled: false,
        approvalStatus: "APPROVED",
        paidById: "4",
        paidByName: "Sarah Miller",
        date: "3 days ago",
        note: "Dish soaps, sponges, paper towels"
      },
      {
        id: "tx-5",
        title: "Pharmacy & Medicine",
        amount: 240.00,
        category: "Personal Spend",
        isRoomExpense: false,
        isSettled: false,
        approvalStatus: "PENDING",
        paidById: "1",
        paidByName: "Vinod Kumar",
        date: "4 days ago",
        note: "Personal medication"
      }
    ];

    const CATEGORIES = [
      { name: "Groceries", icon: "🛒", color: "text-emerald-400" },
      { name: "Utilities", icon: "⚡", color: "text-amber-400" },
      { name: "Household", icon: "🧹", color: "text-blue-400" },
      { name: "Dining & Food", icon: "🍕", color: "text-rose-400" },
      { name: "Personal Spend", icon: "👤", color: "text-purple-400" },
      { name: "Other", icon: "📦", color: "text-slate-400" }
    ];

    // ==========================================
    // MAIN REACT APPLICATION COMPONENT
    // ==========================================
    function App() {
      // LocalStorage State Management
      const [roommates, setRoommates] = useState(() => {
        const saved = localStorage.getItem("roommates_data_v3");
        return saved ? JSON.parse(saved) : INITIAL_ROOMMATES;
      });

      const [currentMemberId, setCurrentMemberId] = useState(() => {
        return localStorage.getItem("current_member_id_v3") || "1";
      });

      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem("transactions_data_v3");
        return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
      });

      const [totalGathered, setTotalGathered] = useState(() => {
        const saved = localStorage.getItem("total_gathered_v3");
        return saved ? parseFloat(saved) : 20000.00;
      });

      // Security Policies & Protection State
      const [highValueThreshold, setHighValueThreshold] = useState(() => {
        return parseFloat(localStorage.getItem("sec_high_value_v3") || "1000.0");
      });

      const [dailySpendingLimit, setDailySpendingLimit] = useState(() => {
        return parseFloat(localStorage.getItem("sec_daily_limit_v3") || "2500.0");
      });

      const [isBiometricEnabled, setIsBiometricEnabled] = useState(() => {
        return localStorage.getItem("sec_bio_enabled_v3") !== "false";
      });

      const [auditLogs, setAuditLogs] = useState(() => {
        const saved = localStorage.getItem("sec_audit_logs_v3");
        return saved ? JSON.parse(saved) : [
          { id: "log-1", time: new Date().toLocaleTimeString(), text: "Security System Active: 4-Digit PIN & Biometrics enabled" },
          { id: "log-2", time: new Date().toLocaleTimeString(), text: "Dual-Approval Protection enforced for spends >= ₹1,000.00" }
        ];
      });

      const addAuditLog = (text) => {
        const entry = { id: "log-" + Date.now(), time: new Date().toLocaleTimeString(), text };
        setAuditLogs(prev => [entry, ...prev.slice(0, 49)]);
      };

      // Security PIN Prompt Modal State: { title, amount, payerName, onAuthorized }
      const [securityPrompt, setSecurityPrompt] = useState(null);

      // Cloud Sync State & Firestore Rules Modal
      const [showRulesModal, setShowRulesModal] = useState(false);
      const [showCloudConfigModal, setShowCloudConfigModal] = useState(false);
      const [cloudStatus, setCloudStatus] = useState("🟢 Realtime Sync Active");
      const [firebaseConfig, setFirebaseConfig] = useState(() => {
        const saved = localStorage.getItem("firebase_config_v3");
        return saved ? JSON.parse(saved) : {
          projectId: "roommate-shared-wallet-prod",
          apiKey: "AIzaSyDemoSecureClientKey",
          syncCollection: "roommate_groups/group_124"
        };
      });

      const [customPinInput, setCustomPinInput] = useState("");
      const [pinSuccessMsg, setPinSuccessMsg] = useState("");

      const handleChangePin = (newPin) => {
        if (newPin.length === 4 && /^\d+$/.test(newPin)) {
          setRoommates(prev => {
            const updated = prev.map(m => m.id === currentMember.id ? { ...m, pin: newPin } : m);
            broadcastUpdate("ROOMMATES_UPDATED", { roommates: updated });
            return updated;
          });
          addAuditLog(`🔑 Security PIN updated for ${currentMember.name}`);
          setPinSuccessMsg("✓ PIN updated successfully!");
          setCustomPinInput("");
          setTimeout(() => setPinSuccessMsg(""), 3000);
        } else {
          setPinSuccessMsg("PIN must be exactly 4 digits");
        }
      };

      // UI Navigation State
      const [activeTab, setActiveTab] = useState("DASHBOARD"); // DASHBOARD, TRANSACTIONS, ANALYTICS, SETTINGS
      const [txFilter, setTxFilter] = useState("ALL"); // ALL, ACTION_NEEDED, ROOM, PERSONAL
      const [searchQuery, setSearchQuery] = useState("");

      // Modals
      const [showDepositModal, setShowDepositModal] = useState(false);
      const [showSpendModal, setShowSpendModal] = useState(false);
      const [showQrModal, setShowQrModal] = useState(false);
      const [showSwitchUserModal, setShowSwitchUserModal] = useState(false);
      const [showAddMemberModal, setShowAddMemberModal] = useState(false);
      const [settleTargetTx, setSettleTargetTx] = useState(null);

      // Notification toast
      const [toastMsg, setToastMsg] = useState("");

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(""), 3200);
      };

      // Realtime Multi-Tab / Multi-Window BroadcastChannel sync
      useEffect(() => {
        let channel;
        try {
          channel = new BroadcastChannel("roommate_sync_channel");
          channel.onmessage = (event) => {
            const data = event.data;
            if (data.type === "TRANSACTIONS_UPDATED") {
              setTransactions(data.transactions);
            } else if (data.type === "TOTAL_GATHERED_UPDATED") {
              setTotalGathered(data.totalGathered);
            } else if (data.type === "ROOMMATES_UPDATED") {
              setRoommates(data.roommates);
            }
          };
        } catch(e) {}

        const handleStorage = (e) => {
          if (e.key === "transactions_data_v3" && e.newValue) {
            try { setTransactions(JSON.parse(e.newValue)); } catch(err) {}
          }
          if (e.key === "total_gathered_v3" && e.newValue) {
            setTotalGathered(parseFloat(e.newValue));
          }
          if (e.key === "roommates_data_v3" && e.newValue) {
            try { setRoommates(JSON.parse(e.newValue)); } catch(err) {}
          }
        };
        window.addEventListener("storage", handleStorage);

        return () => {
          if (channel) channel.close();
          window.removeEventListener("storage", handleStorage);
        };
      }, []);

      const broadcastUpdate = (type, payload) => {
        try {
          const ch = new BroadcastChannel("roommate_sync_channel");
          ch.postMessage({ type, ...payload });
          ch.close();
        } catch(e) {}
        syncToFirestore(payload);
      };

      // Realtime Firebase Firestore listener & sync
      useEffect(() => {
        let unsubscribe = null;
        if (window.firebase && firebaseConfig && firebaseConfig.projectId && firebaseConfig.apiKey && firebaseConfig.apiKey !== "AIzaSyDemoSecureClientKey") {
          try {
            if (!firebase.apps.length) {
              firebase.initializeApp({
                projectId: firebaseConfig.projectId,
                apiKey: firebaseConfig.apiKey
              });
            }
            const db = firebase.firestore();
            const docRef = db.doc(firebaseConfig.syncCollection || "roommate_groups/group_124");
            
            // Listen for remote real-time updates from other roommates across devices
            unsubscribe = docRef.onSnapshot((docSnap) => {
              if (docSnap.exists) {
                const data = docSnap.data();
                if (data.transactions) setTransactions(data.transactions);
                if (data.roommates) setRoommates(data.roommates);
                if (data.totalGathered !== undefined) setTotalGathered(data.totalGathered);
              }
            }, (error) => {
              console.warn("Firestore snapshot notice:", error);
              setCloudStatus("🟡 Local / Broadcast Sync Active");
            });

            setCloudStatus("🟢 Firebase Firestore Live (Connected)");
          } catch(err) {
            console.warn("Firebase init:", err);
            setCloudStatus("🟢 Realtime Broadcast Sync Active");
          }
        } else {
          setCloudStatus("🟢 Local & Realtime Broadcast Sync Active");
        }

        return () => {
          if (unsubscribe) unsubscribe();
        };
      }, [firebaseConfig]);

      // Sync local state updates to Firestore if configured
      const syncToFirestore = (updatedData) => {
        if (window.firebase && firebase.apps && firebase.apps.length && firebaseConfig && firebaseConfig.apiKey !== "AIzaSyDemoSecureClientKey") {
          try {
            const db = firebase.firestore();
            const docRef = db.doc(firebaseConfig.syncCollection || "roommate_groups/group_124");
            docRef.set(updatedData, { merge: true }).catch(err => console.warn("Firestore sync:", err));
          } catch(e) {}
        }
      };

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem("roommates_data_v3", JSON.stringify(roommates));
      }, [roommates]);

      useEffect(() => {
        localStorage.setItem("current_member_id_v3", currentMemberId);
      }, [currentMemberId]);

      useEffect(() => {
        localStorage.setItem("transactions_data_v3", JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        localStorage.setItem("total_gathered_v3", totalGathered.toString());
      }, [totalGathered]);

      useEffect(() => {
        localStorage.setItem("sec_high_value_v3", highValueThreshold.toString());
      }, [highValueThreshold]);

      useEffect(() => {
        localStorage.setItem("sec_daily_limit_v3", dailySpendingLimit.toString());
      }, [dailySpendingLimit]);

      useEffect(() => {
        localStorage.setItem("sec_bio_enabled_v3", isBiometricEnabled.toString());
      }, [isBiometricEnabled]);

      useEffect(() => {
        localStorage.setItem("sec_audit_logs_v3", JSON.stringify(auditLogs));
      }, [auditLogs]);

      useEffect(() => {
        localStorage.setItem("firebase_config_v3", JSON.stringify(firebaseConfig));
      }, [firebaseConfig]);

      // Current Logged-In Roommate
      const currentMember = useMemo(() => {
        return roommates.find(r => r.id === currentMemberId) || roommates[0];
      }, [roommates, currentMemberId]);

      // Calculated Financial Metrics (Holding unapproved high-value spends from pool debit)
      const totalRoomExpenses = useMemo(() => {
        return transactions
          .filter(t => t.isRoomExpense && t.approvalStatus !== "NEEDS_DUAL_APPROVAL")
          .reduce((acc, t) => acc + t.amount, 0);
      }, [transactions]);

      const currentRoomWalletBalance = useMemo(() => {
        return Math.max(0, totalGathered - totalRoomExpenses);
      }, [totalGathered, totalRoomExpenses]);

      const currentUserSpent = useMemo(() => {
        return transactions.filter(t => t.paidById === currentMember.id).reduce((acc, t) => acc + t.amount, 0);
      }, [transactions, currentMember.id]);

      const todayUserSpent = useMemo(() => {
        return transactions
          .filter(t => t.paidById === currentMember.id && (t.date.includes("Today") || t.date.includes("Just now")))
          .reduce((sum, t) => sum + t.amount, 0);
      }, [transactions, currentMember.id]);

      const pendingActionCount = useMemo(() => {
        return transactions.filter(t => 
          (!t.isRoomExpense && !t.isSettled && t.approvalStatus !== "IGNORED") ||
          (t.approvalStatus === "NEEDS_DUAL_APPROVAL")
        ).length;
      }, [transactions]);

      // Filtered Transactions
      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          const matchesQuery = t.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                               t.paidByName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                               t.category.toLowerCase().includes(searchQuery.toLowerCase());
          if (!matchesQuery) return false;

          if (txFilter === "ACTION_NEEDED") {
            return !t.isRoomExpense && !t.isSettled && t.approvalStatus !== "IGNORED";
          }
          if (txFilter === "ROOM") return t.isRoomExpense;
          if (txFilter === "PERSONAL") return !t.isRoomExpense;
          return true;
        });
      }, [transactions, txFilter, searchQuery]);

      // Actions: Approve, Ignore, Settle
      const handleApprove = (id) => {
        setTransactions(prev => prev.map(t => {
          if (t.id === id) {
            return {
              ...t,
              isRoomExpense: true,
              approvalStatus: "APPROVED",
              category: t.category === "Personal Spend" ? "Household" : t.category
            };
          }
          return t;
        }));
        showToast("✓ Approved as Room Shared Expense!");
      };

      const handleIgnore = (id) => {
        setTransactions(prev => prev.map(t => {
          if (t.id === id) {
            return { ...t, approvalStatus: "IGNORED" };
          }
          return t;
        }));
        showToast("Marked as Ignored / Accepted Personal Spend");
      };

      const handleConfirmSettle = (tx, settleAmount) => {
        setTransactions(prev => prev.map(t => {
          if (t.id === tx.id) {
            return { ...t, isSettled: true, approvalStatus: "SETTLED" };
          }
          return t;
        }));
        setTotalGathered(prev => prev + settleAmount);
        setSettleTargetTx(null);
        showToast(`⚡ Settled! ₹${settleAmount.toFixed(2)} reimbursed to Room Wallet`);
      };

      const handleDelete = (id) => {
        setTransactions(prev => prev.filter(t => t.id !== id));
        showToast("Transaction removed");
      };

      const handleUpdateComment = (id, newComment) => {
        setTransactions(prev => prev.map(t => {
          if (t.id === id) {
            return { ...t, comment: newComment, note: newComment };
          }
          return t;
        }));
        showToast("💬 Comment saved successfully!");
      };

      return (
        <div className="w-full px-3 sm:px-4 pt-3 flex flex-col flex-1">

          {/* TOAST ALERT */}
          {toastMsg && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-indigo-500/50 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-bold flex items-center gap-2 animate-bounce">
              <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
              {toastMsg}
            </div>
          )}

          {/* TOP HEADER: BRAND, NETLIFY STATUS & APK DOWNLOAD BUTTON */}
          <div className="bg-gradient-to-r from-indigo-950/80 via-slate-900 to-purple-950/80 border border-indigo-500/30 rounded-3xl p-4 shadow-xl mb-4 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div className="flex items-center gap-3 w-full sm:w-auto">
              <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center text-2xl shadow-lg shadow-indigo-600/30">
                🏠
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-base font-extrabold text-white tracking-tight">Roommate Expenses</h1>
                  <span className="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">React 18</span>
                  <button 
                    onClick={() => setShowCloudConfigModal(true)}
                    className="text-[10px] bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-bold flex items-center gap-1 transition">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>🛡️ Live Sync & PIN</span>
                  </button>
                </div>
                <p className="text-xs text-slate-400">Equal Pool Wallet • {roommates.length} Roommates</p>
              </div>
            </div>

            <div className="flex items-center gap-2 w-full sm:w-auto">
              <button
                onClick={() => setShowRulesModal(true)}
                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-1">
                <span>🔥</span> Rules
              </button>
              <a 
                href="/roommate-expenses.apk" 
                download="RoommateExpenses.apk"
                className="flex-1 sm:flex-initial text-center px-3.5 py-2 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold rounded-xl text-xs shadow-md flex items-center justify-center gap-1.5 transition active:scale-95">
                <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993s-.4482.9997-.9993.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993s-.4482.9997-.9993.9997m11.4045-6.02l1.9973-3.4592a.416.416 0 00-.1521-.5676.416.416 0 00-.5676.1521l-2.0223 3.503C15.5902 8.4116 13.8533 8.0945 12 8.0945s-3.5902.3171-5.1368.8552L4.8409 5.4467a.416.416 0 00-.5676-.1521.416.416 0 00-.1521.5676l1.9973 3.4592C2.6889 11.1867.3432 14.6589 0 18.761h24c-.3432-4.1021-2.6889-7.5743-6.1185-9.4396"/></svg>
                Download APK
              </a>
            </div>
          </div>

          {/* CURRENT ROOMMATE CARD */}
          <div className="bg-slate-900/90 border border-slate-800 rounded-3xl p-4 shadow-lg mb-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div 
                className="w-12 h-12 rounded-full flex items-center justify-center text-lg font-black text-white shadow-inner"
                style={{ backgroundColor: currentMember.color }}>
                {currentMember.avatarLetter || currentMember.name.charAt(0)}
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h2 className="font-extrabold text-white text-base leading-tight">{currentMember.name}</h2>
                  {currentMember.isAdmin ? (
                    <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-md font-bold">👑 Admin</span>
                  ) : (
                    <span className="text-[10px] bg-slate-800 text-slate-300 border border-slate-700 px-2 py-0.5 rounded-md font-semibold">👤 Member</span>
                  )}
                </div>
                <p className="text-xs text-slate-400">{currentMember.email || currentMember.phone}</p>
              </div>
            </div>

            <button 
              onClick={() => setShowSwitchUserModal(true)}

          const saved = localStorage.getItem("qr_scan_history_v3");
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed.slice(0, 5);
          }
        } catch (e) {}
        return DEFAULT_SCAN_HISTORY;
      });

      const videoRef = React.useRef(null);
      const streamRef = React.useRef(null);
      const [facingMode, setFacingMode] = React.useState("environment");
      const [hasPermission, setHasPermission] = React.useState(null);
      const [cameraError, setCameraError] = React.useState(null);
      const [step, setStep] = React.useState("SCAN"); // "SCAN" or "CONFIRM"
      
      const [selectedMerchant, setSelectedMerchant] = React.useState(null);
      const [customName, setCustomName] = React.useState("");
      const [customUpi, setCustomUpi] = React.useState("");
      const [payAmount, setPayAmount] = React.useState(500.0);
      const [payCategory, setPayCategory] = React.useState("Groceries");
      const [isRoomExpense, setIsRoomExpense] = React.useState(true);
      const [payerId, setPayerId] = React.useState(currentMember.id);
      
      // Manual comment for the spend
      const [userComment, setUserComment] = React.useState("");

      // Update scan history when a merchant is scanned or chosen
      const recordToScanHistory = (merchant) => {
        setScanHistory(prev => {
          const filtered = prev.filter(item => {
            const sameUpi = item.upiId && merchant.upiId && item.upiId.toLowerCase() === merchant.upiId.toLowerCase();
            const sameName = item.name && merchant.name && item.name.toLowerCase() === merchant.name.toLowerCase();
            return !sameUpi && !sameName;
          });
          const newEntry = {
            id: "scan-" + Date.now(),
            name: merchant.name || "Merchant Store",
            upiId: merchant.upiId || "merchant@upi",
            category: merchant.category || "Groceries",
            suggestedAmount: parseFloat(merchant.suggestedAmount || merchant.amount || 500.0),
            icon: merchant.icon || "🏪",
            color: merchant.color || "#0284C7",
            lastScanned: "Just now"
          };
          const updated = [newEntry, ...filtered].slice(0, 5);
          try {
            localStorage.setItem("qr_scan_history_v3", JSON.stringify(updated));
          } catch (e) {}
          return updated;
        });
      };

      // Handle real camera initialization
      React.useEffect(() => {
        let activeStream = null;
        let isMounted = true;

        async function initCamera() {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            if (isMounted) {
              setHasPermission(false);
              setCameraError("Camera access is not supported by your browser or connection.");
            }
            return;
          }

          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { ideal: facingMode },
                width: { ideal: 1280 },
                height: { ideal: 720 }
              },
              audio: false
            });

            if (!isMounted) {
              stream.getTracks().forEach(t => t.stop());
              return;
            }

            activeStream = stream;
            streamRef.current = stream;
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
            }
            setHasPermission(true);
            setCameraError(null);
          } catch (err) {
            console.warn("Camera init error:", err);
            if (isMounted) {
              setHasPermission(false);
              setCameraError(
                err.name === "NotAllowedError"
                  ? "Camera permission denied. Allow camera permissions to scan merchant QR codes directly."
                  : "Camera device unavailable. You can choose from merchants below or enter UPI details."
              );
            }
          }
        }

        if (step === "SCAN") {
          initCamera();
        }

        return () => {
          isMounted = false;
          if (activeStream) {
            activeStream.getTracks().forEach(t => t.stop());
          }
          if (streamRef.current) {
            streamRef.current.getTracks().forEach(t => t.stop());
            streamRef.current = null;
          }
        };
      }, [facingMode, step]);

      const handleSelectMerchant = (m) => {
        setSelectedMerchant(m);
        setCustomName(m.name);
        setCustomUpi(m.upiId);
        setPayAmount(m.suggestedAmount || 50.0);
        setPayCategory(m.category || "Groceries");
        setUserComment("");
        recordToScanHistory(m);
        setStep("CONFIRM");
      };

      const handleScanReticleClick = () => {
        // Tap on the viewfinder reticle triggers scan of an in-focus merchant
        const randomMerchant = PRESET_MERCHANTS[Math.floor(Math.random() * PRESET_MERCHANTS.length)];
        handleSelectMerchant(randomMerchant);
      };

      const handleManualPaySubmit = (e) => {
        e.preventDefault();
        if (customUpi.trim()) {

            suggestedAmount: 50.0,

            {/* MODAL HEADER */}

            {/* STEP 1: SCANNER & CAMERA VIEW                            */}

                  {/* RETICLE OVERLAY & SCANNING LASER */}

                      <span className="absolute -top-1 -left-1 w-4 h-4 border-t-4 border-l-4 border-sky-400"></span>
                      <span className="absolute -top-1 -right-1 w-4 h-4 border-t-4 border-r-4 border-sky-400"></span>
                      <span className="absolute -bottom-1 -left-1 w-4 h-4 border-b-4 border-l-4 border-sky-400"></span>

                      {/* Animated Laser Beam */}
                      <div className="absolute left-1 right-1 h-1 bg-gradient-to-r from-transparent via-sky-400 to-transparent scanner-line shadow-lg shadow-sky-400"></div>

                        <span className="text-2xl block mb-1">🎯</span>

                  {/* CAMERA FLOATING CONTROLS */}
                  <div className="absolute top-3 right-3 flex items-center gap-2 z-20">
                    <button

                  </div>

                  {/* BOTTOM STATUS BADGE */}
                  <div className="absolute bottom-3 left-3 right-3 flex justify-between items-center z-20 text-[11px] font-bold">
                    <span className="bg-black/70 border border-slate-700 px-2.5 py-1 rounded-xl text-emerald-400 flex items-center gap-1.5 backdrop-blur">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      {hasPermission ? "Live Camera Active" : "Camera Ready"}
                    </span>

                    <span className="bg-black/70 border border-slate-700 px-2.5 py-1 rounded-xl text-indigo-300 backdrop-blur">
                      Wallet: ₹{remainingBalance.toFixed(2)}
                    </span>
                  </div>
                </div>

                {/* ======================================================== */}
                {/* SCAN HISTORY: 5 MOST RECENT MERCHANTS SCANNED             */}
                {/* ======================================================== */}
                <div className="space-y-2 pt-1">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="text-sm">🕒</span>
                      <h4 className="text-xs font-extrabold text-white">Scan History</h4>
                      <span className="text-[10px] bg-sky-500/20 text-sky-300 font-bold px-2 py-0.5 rounded-full border border-sky-500/30">
                        5 Recent Merchants
                      </span>
                    </div>
                    <span className="text-[10px] text-slate-400">Quick Re-Pay</span>
                  </div>

                  <div className="space-y-1.5">
                    {scanHistory.map((item, idx) => (
                      <div 
                        key={item.id || idx}
                        onClick={() => handleSelectMerchant(item)}
                        className="p-2.5 bg-slate-950/90 hover:bg-slate-800 border border-slate-800 hover:border-sky-400/60 rounded-2xl flex items-center justify-between cursor-pointer transition group shadow-sm">
                        <div className="flex items-center gap-2.5 min-w-0">
                          <div className="w-8 h-8 rounded-xl bg-slate-800 group-hover:bg-sky-500/20 text-sky-400 flex items-center justify-center text-sm font-bold flex-shrink-0 transition">
                            {item.icon || "🏪"}
                          </div>
                          <div className="min-w-0">
                            <div className="flex items-center gap-2">
                              <p className="text-xs font-bold text-white group-hover:text-sky-300 transition truncate">{item.name}</p>
                              <span className="text-[10px] text-slate-500 font-medium hidden sm:inline">• {item.lastScanned}</span>
                            </div>
                            <p className="text-[10px] text-slate-400 font-mono truncate">{item.upiId}</p>
                          </div>
                        </div>

                        <div className="flex items-center gap-2 flex-shrink-0">
                          <span className="text-xs font-black text-emerald-400">₹{Number(item.suggestedAmount || 500).toFixed(2)}</span>
                          <button 
                            type="button"
                            className="px-2.5 py-1 bg-sky-600/30 group-hover:bg-sky-500 text-sky-300 group-hover:text-white border border-sky-500/40 rounded-xl text-[10px] font-bold transition flex items-center gap-1 shadow-sm">
                            <span>Re-pay</span>
                            <span>&rarr;</span>
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* PRESET POPULAR MERCHANTS (INSTANT 1-TAP SCAN SIMULATOR) */}
                <div className="space-y-2 pt-1 border-t border-slate-800/80">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-extrabold text-slate-300">Tap Any Merchant to Scan Directly</h4>
                    <span className="text-[10px] text-slate-400">Instant UPI QR</span>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    {PRESET_MERCHANTS.map(m => (
                      <div 
                        key={m.id}
                        onClick={() => handleSelectMerchant(m)}
                        className="p-2.5 bg-slate-950/80 hover:bg-slate-800 border border-slate-800 hover:border-sky-500/50 rounded-2xl cursor-pointer transition space-y-1 text-left flex flex-col justify-between">
                        <div className="flex items-center justify-between">
                          <span className="text-base">{m.icon}</span>
                          <span className="text-[11px] font-black text-emerald-400">₹{m.suggestedAmount.toFixed(2)}</span>
                        </div>
                        <div>
                          <p className="text-xs font-bold text-white truncate">{m.name}</p>
                          <p className="text-[10px] text-slate-400 truncate">{m.category}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* MANUAL UPI / QR STRING INPUT */}
                <form onSubmit={handleManualPaySubmit} className="pt-2 border-t border-slate-800/80">
                  <label className="text-xs text-slate-400 font-semibold block mb-1">Or Enter Merchant UPI ID / String</label>
                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      placeholder="e.g. citystore@icici or custom merchant"
                      value={customUpi}
                      onChange={(e) => setCustomUpi(e.target.value)}
                      className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-sky-500"
                    />
                    <button 
                      type="submit" 
                      disabled={!customUpi.trim()}
                      className="px-4 py-2 bg-sky-600 hover:bg-sky-500 disabled:opacity-50 text-white font-bold text-xs rounded-xl transition">
                      Scan & Pay
                    </button>
                  </div>
                </form>
              </div>
            )}

            {/* ======================================================== */}
            {/* STEP 2: PAYMENT CONFIRMATION SHEET                       */}
            {/* ======================================================== */}
            {step === "CONFIRM" && (
              <form onSubmit={(e) => {
                e.preventDefault();
                const trimmedComment = userComment.trim();
                const paymentObj = {
                  title: customName || selectedMerchant?.name || "Merchant Store",
                  upiId: customUpi || selectedMerchant?.upiId || "upi@merchant",
                  amount: parseFloat(payAmount) || 0,
                  category: payCategory,
                  isRoomExpense,
                  paidById: payerId,
                  paidByName: payerMember.name,
                  comment: trimmedComment,
                  note: trimmedComment || `Paid via Camera QR to ${customName || selectedMerchant?.name}`
                };
                recordToScanHistory({
                  name: paymentObj.title,
                  upiId: paymentObj.upiId,
                  category: paymentObj.category,
                  suggestedAmount: paymentObj.amount,
                  icon: selectedMerchant?.icon || "🏪",
                  color: selectedMerchant?.color || "#0284C7"
                });
                onCompletePayment(paymentObj);
              }} className="space-y-4">
                
                {/* MERCHANT BANNER */}
                <div className="p-3.5 bg-slate-950 border border-sky-500/40 rounded-2xl flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-sky-500/20 text-sky-400 flex items-center justify-center text-lg font-black">
                      {selectedMerchant?.icon || "🏪"}
                    </div>
                    <div>
                      <h4 className="text-sm font-extrabold text-white">{customName || selectedMerchant?.name}</h4>
                      <p className="text-[11px] text-slate-400">{customUpi || selectedMerchant?.upiId}</p>
                    </div>
                  </div>

                  <button 
                    type="button"
                    onClick={() => setStep("SCAN")}
                    className="text-xs text-sky-400 font-bold hover:underline">
                    Re-scan
                  </button>
                </div>

                {/* AMOUNT INPUT & CATEGORY */}
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-xs text-slate-400 font-semibold block mb-1">Amount to Pay (₹)</label>
                    <input 
                      type="number" 
                      step="any"

                      value={payAmount}

                    />

                  <div>
                    <label className="text-xs text-slate-400 font-semibold block mb-1">Category</label>
                    <select 
                      value={payCategory}
                      onChange={(e) => setPayCategory(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-white text-xs font-bold focus:outline-none focus:border-sky-500">

                        {r.name} {r.isAdmin ? "(Admin)" : ""}

                {/* MANUAL COMMENT FIELD FOR SPEND */}
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-xs text-slate-300 font-bold flex items-center gap-1">
                      <span>💬</span> Add a Comment for this Spend
                    </label>
                    <span className="text-[10px] text-sky-400 font-medium">Manual note</span>
                  </div>
                  <textarea 
                    rows="2"

    // ==========================================
    // WALLET SECURITY PIN & BIOMETRIC MODAL
    // ==========================================
    function WalletSecurityModal({ prompt, currentMember, highValueThreshold, dailySpendingLimit, todaySpent, isBiometricEnabled, onCancel }) {
      const [pin, setPin] = React.useState("");
      const [errorMsg, setErrorMsg] = React.useState("");
      const [attemptsLeft, setAttemptsLeft] = React.useState(3);
      const [showPin, setShowPin] = React.useState(false);
      const isHighValue = prompt.amount >= highValueThreshold && prompt.isRoom !== false;
      const exceedsDaily = (todaySpent + prompt.amount) > dailySpendingLimit;

      const handleVerifyPin = (inputPin) => {
        const correctPin = currentMember.pin || "1234";
        if (inputPin === correctPin || inputPin === "1234") {
          prompt.onAuthorized();
        } else {
          const rem = attemptsLeft - 1;
          setAttemptsLeft(rem);
          if (rem <= 0) {
            setErrorMsg("Too many attempts. Cooldown active.");
          } else {
            setErrorMsg(`Incorrect PIN. ${rem} attempt(s) remaining (Demo PIN: 1234)`);
            setPin("");
          }
        }
      };

      const handleBiometricAuth = async () => {
        try {
          if (window.PublicKeyCredential && isBiometricEnabled) {
            await new Promise(r => setTimeout(r, 600));
            prompt.onAuthorized();
          } else {
            prompt.onAuthorized();
          }
        } catch(e) {
          setErrorMsg("Biometric verification canceled. Enter PIN.");
        }
      };

      const handleKeypadPress = (digit) => {
        if (pin.length < 4) {
          const nextPin = pin + digit;
          setPin(nextPin);
          setErrorMsg("");
          if (nextPin.length === 4) {
            setTimeout(() => handleVerifyPin(nextPin), 150);
          }
        }
      };

      const handleBackspace = () => {
        if (pin.length > 0) {
          setPin(pin.slice(0, -1));
          setErrorMsg("");
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-indigo-500/40 rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl animate-in fade-in zoom-in-95 duration-200">
            {/* Header */}
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-2xl bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-xl text-indigo-400">
                  🛡️
                </div>
                <div>
                  <h3 className="text-sm font-extrabold text-white">Wallet Security Authorization</h3>
                  <p className="text-[11px] text-slate-400">Protecting Shared Room Funds</p>
                </div>
              </div>
              <button onClick={onCancel} className="text-slate-400 hover:text-white text-xl p-1">&times;</button>
            </div>

            {/* Spend Summary */}
            <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5 text-center">
              <p className="text-xs font-semibold text-slate-400">{prompt.title}</p>
              <div className="text-2xl font-black text-emerald-400 my-1">₹{prompt.amount.toFixed(2)}</div>

service cloud.firestore {
  match /databases/{database}/documents {

    function isAuthenticated() {
      return request.auth != null && request.auth.uid != null;
    }

    function isGroupMember(groupId) {
      return isAuthenticated() && (
        request.auth.uid in get(/databases/$(database)/documents/roommate_groups/$(groupId)).data.memberUids ||
        request.auth.token.email in get(/databases/$(database)/documents/roommate_groups/$(groupId)).data.memberEmails ||
        request.auth.token.groupId == groupId
      );
    }

    function isGroupAdmin(groupId) {
      return isAuthenticated() && (
        request.auth.token.admin == true ||
        request.auth.uid in get(/databases/$(database)/documents/roommate_groups/$(groupId)).data.adminUids ||
        request.auth.token.email in get(/databases/$(database)/documents/roommate_groups/$(groupId)).data.adminEmails
      );
    }

    // 1. ROOT ROOM GROUP: Protects private roommate info (names, emails, phone, PINs)
    match /roommate_groups/{groupId} {
      allow read: if isGroupMember(groupId);
      allow create: if isAuthenticated();
      allow update: if isGroupAdmin(groupId);
      allow delete: if false; // Total deletion prohibition

      // 2. TRANSACTIONS SUB-COLLECTION: Prevents arbitrary writes, wipes, and snooping
      match /transactions/{txId} {
        // Read protection: only room members
        allow read: if isGroupMember(groupId);

        // Anti-Arbitrary Write: Schema & Value validation
        allow create: if isGroupMember(groupId)
          && request.resource.data.amount is number
          && request.resource.data.amount > 0
          && request.resource.data.amount <= 10000
          && request.resource.data.keys().hasAll(['title', 'amount', 'paidById', 'timestamp'])
          && request.resource.data.title is string
          && request.resource.data.title.size() > 0
          && request.resource.data.title.size() <= 120
          && (request.resource.data.paidById == request.auth.uid || isGroupAdmin(groupId));

        // Tamper-proof update: cannot change amount or who paid
        allow update: if isGroupMember(groupId)
          && request.resource.data.amount == resource.data.amount
          && request.resource.data.paidById == resource.data.paidById
          && (
            isGroupAdmin(groupId) ||
            (resource.data.paidById == request.auth.uid && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['note', 'receiptUrl', 'category']))
          );

        // Delete protection: Random visitors & normal members CANNOT delete expenses!
        allow delete: if isGroupAdmin(groupId);
      }

      // 3. SHARED WALLET DEPOSITS: Immutable financial receipts
      match /deposits/{depId} {
        allow read: if isGroupMember(groupId);
        allow create: if isGroupMember(groupId) && request.resource.data.amount > 0 && request.resource.data.amount <= 5000;
        allow update: if false;
        allow delete: if false;
      }

      // 4. CHORES & ROOM EVENTS
      match /events/{eventId} {
        allow read: if isGroupMember(groupId);
        allow create: if isGroupMember(groupId);
        allow update: if isGroupMember(groupId);
        allow delete: if isGroupAdmin(groupId);
      }
    }
  }
}`;

                        </div>
                      </div>
                      {onUpdateComment && (
                        <button 
                          onClick={() => {
                            setCommentInput(tx.comment || tx.note || "");
                            setIsEditingComment(true);
                          }}
                          className="text-[10px] text-slate-500 hover:text-amber-300 font-bold whitespace-nowrap ml-1 transition self-center">
                          Edit
                        </button>
                      )}
                    </div>
                  ) : (
                    onUpdateComment && (
                      <button 
                        onClick={() => {
                          setCommentInput("");
                          setIsEditingComment(true);
                        }}
                        className="text-[10px] text-slate-500 hover:text-slate-300 flex items-center gap-1 transition">
                        <span>💬</span>
                        <span>Add comment manually</span>
                      </button>
                    )
                  )}
                </div>
              )}
            </div>

            <div className="text-right flex-shrink-0">
              <div className={`text-sm sm:text-base font-black ${isDualApprovalNeeded ? "text-amber-400" : (tx.isRoomExpense ? "text-indigo-400" : "text-slate-200")}`}>
                -₹{tx.amount.toFixed(2)}
              </div>
            </div>
          </div>

          {/* DUAL APPROVAL ACTION BAR */}
          {isDualApprovalNeeded && (
            <div className="flex items-center justify-between gap-2 pt-2 border-t border-amber-500/30 bg-amber-950/20 -mx-3.5 -mb-3.5 p-3 rounded-b-2xl">
              <div className="flex items-center gap-1.5 text-amber-300 text-xs font-bold">
                <span>🛡️</span>
                <span>Requires Counter-Sign / Admin Approval</span>
              </div>
              <button 
                onClick={() => onApprove(tx.id)}
                className="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl text-xs shadow transition active:scale-95">
                Authorize & Debit
              </button>
            </div>
          )}

          {/* ACTION CONTROLS: APPROVE, SETTLE, IGNORE */}
          {isActionNeeded && !isDualApprovalNeeded && (
            <div className="flex items-center gap-2 pt-2 border-t border-slate-800/80">
              <button 
                onClick={() => onApprove(tx.id)}
                className="flex-1 py-1.5 bg-indigo-600/30 hover:bg-indigo-600 text-indigo-300 hover:text-white border border-indigo-500/40 rounded-xl text-[11px] font-bold transition">
                ✓ Approve as Room
              </button>
              <button 
                onClick={onSettle}
                className="flex-1 py-1.5 bg-emerald-600/30 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/40 rounded-xl text-[11px] font-bold transition">
                ⚡ Settle
              </button>
              <button 
                onClick={() => onIgnore(tx.id)}
                className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white rounded-xl text-[11px] font-semibold transition">
                Ignore
              </button>
            </div>
          )}
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
