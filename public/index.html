<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roommate Expenses & Shared Wallet | React Web App</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#EEF2FF',
              100: '#E0E7FF',
              400: '#818CF8',
              500: '#6366F1',
              600: '#4F46E5',
              700: '#4338CA',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & Babel for JSX -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #090D16;
      color: #F8FAFC;
      -webkit-tap-highlight-color: transparent;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090D16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    @keyframes scanline {
      0% { top: 0%; opacity: 0.8; }
      50% { opacity: 1; }
      100% { top: 100%; opacity: 0.8; }
    }
    .scanner-line {
      animation: scanline 2.2s ease-in-out infinite alternate;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center bg-[#090D16] text-slate-100 selection:bg-indigo-500 selection:text-white">

  <!-- React Root Element -->
  <div id="root" class="w-full max-w-xl flex flex-col min-h-screen pb-24"></div>

  <!-- React Application Source Code -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Default Seed Data
    const INITIAL_ROOMMATES = [
      { id: "1", name: "Vinod Kumar", email: "uvinodkumar614@gmail.com", phone: "+1 (555) 019-2831", isAdmin: true, color: "#6366F1", avatarLetter: "V" },
      { id: "2", name: "Alex Chen", email: "alex.chen@example.com", phone: "+1 (555) 014-9210", isAdmin: false, color: "#10B981", avatarLetter: "A" },
      { id: "3", name: "Jordan Smith", email: "jordan.s@example.com", phone: "+1 (555) 018-4422", isAdmin: false, color: "#F59E0B", avatarLetter: "J" },
      { id: "4", name: "Sarah Miller", email: "sarah.m@example.com", phone: "+1 (555) 012-7711", isAdmin: false, color: "#EC4899", avatarLetter: "S" }
    ];

    const INITIAL_TRANSACTIONS = [
      {
        id: "tx-1",
        title: "Costco Monthly Groceries & Supplies",
        amount: 218.40,
        category: "Groceries",
        isRoomExpense: true,
        isSettled: false,
        approvalStatus: "APPROVED",
        paidById: "1",
        paidByName: "Vinod Kumar",
        date: "Today, 10:45 AM",
        note: "Shared snacks, oil, pantry items"
      },
      {
        id: "tx-2",
        title: "High-Speed Fiber Internet",
        amount: 80.00,
        category: "Utilities",
        isRoomExpense: true,
        isSettled: false,
        approvalStatus: "APPROVED",
        paidById: "2",
        paidByName: "Alex Chen",
        date: "Yesterday, 4:20 PM",
        note: "Monthly bill 1Gbps"
      },
      {
        id: "tx-3",
        title: "Late Night DoorDash Delivery",
        amount: 32.50,
        category: "Personal Spend",
        isRoomExpense: false,
        isSettled: false,
        approvalStatus: "PENDING",
        paidById: "3",
        paidByName: "Jordan Smith",
        date: "2 days ago",
        note: "Personal sushi order debited"
      },
      {
        id: "tx-4",
        title: "Kitchen Cleaning Supplies & Trash Bags",
        amount: 45.20,
        category: "Household",
        isRoomExpense: true,
        isSettled: false,
        approvalStatus: "APPROVED",
        paidById: "4",
        paidByName: "Sarah Miller",
        date: "3 days ago",
        note: "Dish soaps, sponges, paper towels"
      },
      {
        id: "tx-5",
        title: "Pharmacy & Medicine",
        amount: 24.00,
        category: "Personal Spend",
        isRoomExpense: false,
        isSettled: false,
        approvalStatus: "PENDING",
        paidById: "1",
        paidByName: "Vinod Kumar",
        date: "4 days ago",
        note: "Personal medication"
      }
    ];

    const CATEGORIES = [
      { name: "Groceries", icon: "🛒", color: "text-emerald-400" },
      { name: "Utilities", icon: "⚡", color: "text-amber-400" },
      { name: "Household", icon: "🧹", color: "text-blue-400" },
      { name: "Dining & Food", icon: "🍕", color: "text-rose-400" },
      { name: "Personal Spend", icon: "👤", color: "text-purple-400" },
      { name: "Other", icon: "📦", color: "text-slate-400" }
    ];

    // ==========================================
    // MAIN REACT APPLICATION COMPONENT
    // ==========================================
    function App() {
      // LocalStorage State Management
      const [roommates, setRoommates] = useState(() => {
        const saved = localStorage.getItem("roommates_data_v2");
        return saved ? JSON.parse(saved) : INITIAL_ROOMMATES;
      });

      const [currentMemberId, setCurrentMemberId] = useState(() => {
        return localStorage.getItem("current_member_id_v2") || "1";
      });

      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem("transactions_data_v2");
        return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
      });

      const [totalGathered, setTotalGathered] = useState(() => {
        const saved = localStorage.getItem("total_gathered_v2");
        return saved ? parseFloat(saved) : 2400.00;
      });

      // UI Navigation State
      const [activeTab, setActiveTab] = useState("DASHBOARD"); // DASHBOARD, TRANSACTIONS, ANALYTICS, SETTINGS
      const [txFilter, setTxFilter] = useState("ALL"); // ALL, ACTION_NEEDED, ROOM, PERSONAL
      const [searchQuery, setSearchQuery] = useState("");

      // Modals
      const [showDepositModal, setShowDepositModal] = useState(false);
      const [showSpendModal, setShowSpendModal] = useState(false);
      const [showQrModal, setShowQrModal] = useState(false);
      const [showSwitchUserModal, setShowSwitchUserModal] = useState(false);
      const [showAddMemberModal, setShowAddMemberModal] = useState(false);
      const [settleTargetTx, setSettleTargetTx] = useState(null);

      // Notification toast
      const [toastMsg, setToastMsg] = useState("");

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(""), 3200);
      };

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem("roommates_data_v2", JSON.stringify(roommates));
      }, [roommates]);

      useEffect(() => {
        localStorage.setItem("current_member_id_v2", currentMemberId);
      }, [currentMemberId]);

      useEffect(() => {
        localStorage.setItem("transactions_data_v2", JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        localStorage.setItem("total_gathered_v2", totalGathered.toString());
      }, [totalGathered]);

      // Current Logged-In Roommate
      const currentMember = useMemo(() => {
        return roommates.find(r => r.id === currentMemberId) || roommates[0];
      }, [roommates, currentMemberId]);

      // Calculated Financial Metrics
      const totalRoomExpenses = useMemo(() => {
        return transactions.filter(t => t.isRoomExpense).reduce((acc, t) => acc + t.amount, 0);
      }, [transactions]);

      const currentRoomWalletBalance = useMemo(() => {
        return Math.max(0, totalGathered - totalRoomExpenses);
      }, [totalGathered, totalRoomExpenses]);

      const currentUserSpent = useMemo(() => {
        return transactions.filter(t => t.paidById === currentMember.id).reduce((acc, t) => acc + t.amount, 0);
      }, [transactions, currentMember.id]);

      const pendingActionCount = useMemo(() => {
        return transactions.filter(t => !t.isRoomExpense && !t.isSettled && t.approvalStatus !== "IGNORED").length;
      }, [transactions]);

      // Filtered Transactions
      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          const matchesQuery = t.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                               t.paidByName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                               t.category.toLowerCase().includes(searchQuery.toLowerCase());
          if (!matchesQuery) return false;

          if (txFilter === "ACTION_NEEDED") {
            return !t.isRoomExpense && !t.isSettled && t.approvalStatus !== "IGNORED";
          }
          if (txFilter === "ROOM") return t.isRoomExpense;
          if (txFilter === "PERSONAL") return !t.isRoomExpense;
          return true;
        });
      }, [transactions, txFilter, searchQuery]);

      // Actions: Approve, Ignore, Settle
      const handleApprove = (id) => {
        setTransactions(prev => prev.map(t => {
          if (t.id === id) {
            return {
              ...t,
              isRoomExpense: true,
              approvalStatus: "APPROVED",
              category: t.category === "Personal Spend" ? "Household" : t.category
            };
          }
          return t;
        }));
        showToast("✓ Approved as Room Shared Expense!");
      };

      const handleIgnore = (id) => {
        setTransactions(prev => prev.map(t => {
          if (t.id === id) {
            return { ...t, approvalStatus: "IGNORED" };
          }
          return t;
        }));
        showToast("Marked as Ignored / Accepted Personal Spend");
      };

      const handleConfirmSettle = (tx, settleAmount) => {
        setTransactions(prev => prev.map(t => {
          if (t.id === tx.id) {
            return { ...t, isSettled: true, approvalStatus: "SETTLED" };
          }
          return t;
        }));
        setTotalGathered(prev => prev + settleAmount);
        setSettleTargetTx(null);
        showToast(`⚡ Settled! $${settleAmount.toFixed(2)} reimbursed to Room Wallet`);
      };

      const handleDelete = (id) => {
        setTransactions(prev => prev.filter(t => t.id !== id));
        showToast("Transaction removed");
      };

      return (
        <div className="w-full px-3 sm:px-4 pt-3 flex flex-col flex-1">

          {/* TOAST ALERT */}
          {toastMsg && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-indigo-500/50 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-bold flex items-center gap-2 animate-bounce">
              <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
              {toastMsg}
            </div>
          )}

          {/* TOP HEADER: BRAND, NETLIFY STATUS & APK DOWNLOAD BUTTON */}
          <div className="bg-gradient-to-r from-indigo-950/80 via-slate-900 to-purple-950/80 border border-indigo-500/30 rounded-3xl p-4 shadow-xl mb-4 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div className="flex items-center gap-3 w-full sm:w-auto">
              <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center text-2xl shadow-lg shadow-indigo-600/30">
                🏠
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-base font-extrabold text-white tracking-tight">Roommate Expenses</h1>
                  <span className="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">React 18</span>
                </div>
                <p className="text-xs text-slate-400">Equal Pool Wallet • {roommates.length} Roommates</p>
              </div>
            </div>

            <div className="flex items-center gap-2 w-full sm:w-auto">
              <a 
                href="/roommate-expenses.apk" 
                download="RoommateExpenses.apk"
                className="flex-1 sm:flex-initial text-center px-3.5 py-2 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold rounded-xl text-xs shadow-md flex items-center justify-center gap-1.5 transition active:scale-95">
                <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993s-.4482.9997-.9993.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993s-.4482.9997-.9993.9997m11.4045-6.02l1.9973-3.4592a.416.416 0 00-.1521-.5676.416.416 0 00-.5676.1521l-2.0223 3.503C15.5902 8.4116 13.8533 8.0945 12 8.0945s-3.5902.3171-5.1368.8552L4.8409 5.4467a.416.416 0 00-.5676-.1521.416.416 0 00-.1521.5676l1.9973 3.4592C2.6889 11.1867.3432 14.6589 0 18.761h24c-.3432-4.1021-2.6889-7.5743-6.1185-9.4396"/></svg>
                Download APK
              </a>
            </div>
          </div>

          {/* CURRENT ROOMMATE CARD */}
          <div className="bg-slate-900/90 border border-slate-800 rounded-3xl p-4 shadow-lg mb-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div 
                className="w-12 h-12 rounded-full flex items-center justify-center text-lg font-black text-white shadow-inner"
                style={{ backgroundColor: currentMember.color }}>
                {currentMember.avatarLetter || currentMember.name.charAt(0)}
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h2 className="font-extrabold text-white text-base leading-tight">{currentMember.name}</h2>
                  {currentMember.isAdmin ? (
                    <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-md font-bold">👑 Admin</span>
                  ) : (
                    <span className="text-[10px] bg-slate-800 text-slate-300 border border-slate-700 px-2 py-0.5 rounded-md font-semibold">👤 Member</span>
                  )}
                </div>
                <p className="text-xs text-slate-400">{currentMember.email || currentMember.phone}</p>
              </div>
            </div>

            <button 
              onClick={() => setShowSwitchUserModal(true)}
              className="px-3.5 py-2 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 rounded-2xl text-xs font-bold flex items-center gap-1.5 transition">
              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
              Switch User
            </button>
          </div>

          {/* NAVIGATION SUB-TABS */}
          <div className="flex bg-slate-900 border border-slate-800 rounded-2xl p-1 mb-4 text-xs font-bold text-slate-400">
            <button 
              onClick={() => setActiveTab("DASHBOARD")}
              className={`flex-1 py-2 rounded-xl transition ${activeTab === "DASHBOARD" ? "bg-indigo-600 text-white shadow-md" : "hover:text-white"}`}>
              Dashboard
            </button>
            <button 
              onClick={() => setActiveTab("TRANSACTIONS")}
              className={`flex-1 py-2 rounded-xl transition flex items-center justify-center gap-1.5 ${activeTab === "TRANSACTIONS" ? "bg-indigo-600 text-white shadow-md" : "hover:text-white"}`}>
              Transactions
              {pendingActionCount > 0 && (
                <span className="w-4 h-4 rounded-full bg-amber-400 text-slate-950 text-[10px] flex items-center justify-center font-extrabold">{pendingActionCount}</span>
              )}
            </button>
            <button 
              onClick={() => setActiveTab("ANALYTICS")}
              className={`flex-1 py-2 rounded-xl transition ${activeTab === "ANALYTICS" ? "bg-indigo-600 text-white shadow-md" : "hover:text-white"}`}>
              Splits & Analytics
            </button>
            <button 
              onClick={() => setActiveTab("SETTINGS")}
              className={`flex-1 py-2 rounded-xl transition ${activeTab === "SETTINGS" ? "bg-indigo-600 text-white shadow-md" : "hover:text-white"}`}>
              Settings
            </button>
          </div>

          {/* ======================================================== */}
          {/* TAB 1: DASHBOARD VIEW                                    */}
          {/* ======================================================== */}
          {activeTab === "DASHBOARD" && (
            <div className="space-y-4">

              {/* SHARED POOL WALLET CARD */}
              <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-900 via-indigo-950 to-slate-900 border border-indigo-500/30 p-5 shadow-2xl">
                <div className="flex items-center justify-between text-xs font-semibold text-indigo-200 uppercase tracking-wider mb-1">
                  <span>Equal Room Pool Wallet</span>
                  <span className="flex items-center gap-1.5 text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded-full border border-emerald-500/20 text-xs font-bold">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    {currentRoomWalletBalance > 200 ? "Healthy Balance" : "Needs Deposit"}
                  </span>
                </div>

                <div className="mt-2 flex items-baseline gap-2">
                  <span className="text-4xl sm:text-5xl font-black text-white tracking-tight">
                    ${currentRoomWalletBalance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                  </span>
                </div>
                <p className="text-xs text-indigo-300/80 mt-1">Remaining shared balance for upcoming bills and groceries</p>

                {/* Progress bar */}
                <div className="mt-4 bg-slate-800/90 rounded-full h-3 overflow-hidden p-0.5 border border-indigo-500/20">
                  <div 
                    className="bg-gradient-to-r from-emerald-400 via-indigo-400 to-purple-500 h-full rounded-full transition-all duration-700" 
                    style={{ width: `${Math.min(100, Math.max(8, (currentRoomWalletBalance / totalGathered) * 100))}%` }}>
                  </div>
                </div>

                {/* Metric Summary */}
                <div className="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-indigo-500/20 text-xs">
                  <div>
                    <span className="text-slate-400 block">Total Gathered in Pool:</span>
                    <span className="text-emerald-400 font-extrabold text-sm sm:text-base">${totalGathered.toFixed(2)}</span>
                  </div>
                  <div>
                    <span className="text-slate-400 block">Spent from Pool:</span>
                    <span className="text-rose-400 font-extrabold text-sm sm:text-base">${totalRoomExpenses.toFixed(2)}</span>
                  </div>
                </div>
              </div>

              {/* QUICK STATS ROW */}
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-sm">
                  <div className="flex items-center gap-2 text-indigo-400 text-xs font-semibold mb-1">
                    <span className="p-1.5 rounded-xl bg-indigo-500/10 text-indigo-400">🏠</span>
                    Total Room Spent
                  </div>
                  <div className="text-xl sm:text-2xl font-black text-white">${totalRoomExpenses.toFixed(2)}</div>
                  <span className="text-[11px] text-slate-400">Divided equally ({roommates.length} people)</span>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-sm">
                  <div className="flex items-center gap-2 text-purple-400 text-xs font-semibold mb-1">
                    <span className="p-1.5 rounded-xl bg-purple-500/10 text-purple-400">👤</span>
                    Your Total Spent
                  </div>
                  <div className="text-xl sm:text-2xl font-black text-white">${currentUserSpent.toFixed(2)}</div>
                  <span className="text-[11px] text-slate-400">Paid by {currentMember.name.split(' ')[0]}</span>
                </div>
              </div>

              {/* DIRECT ACTION BUTTONS: DEPOSIT & SPEND */}
              <div className="grid grid-cols-2 gap-3">
                <button 
                  onClick={() => setShowDepositModal(true)}
                  className="py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold rounded-2xl shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2 text-sm transition transform active:scale-95">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                  Add to Wallet
                </button>

                <button 
                  onClick={() => setShowSpendModal(true)}
                  className="py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold rounded-2xl shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2 text-sm transition transform active:scale-95">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                  Spend / Pay
                </button>
              </div>

              {/* ACTION CALLOUT BANNER (IF PENDING ACTIONS EXIST) */}
              {pendingActionCount > 0 && (
                <div 
                  onClick={() => { setTxFilter("ACTION_NEEDED"); setActiveTab("TRANSACTIONS"); }}
                  className="cursor-pointer bg-gradient-to-r from-amber-950/40 via-amber-900/30 to-amber-950/40 border border-amber-500/40 rounded-2xl p-3.5 flex items-center justify-between hover:border-amber-400 transition">
                  <div className="flex items-center gap-3">
                    <span className="text-xl">⚡</span>
                    <div>
                      <h3 className="text-xs font-bold text-amber-200">{pendingActionCount} Transaction(s) Need Action</h3>
                      <p className="text-[11px] text-amber-400/80">Personal spends awaiting approval or settlement</p>
                    </div>
                  </div>
                  <span className="text-xs font-bold bg-amber-500/20 text-amber-300 px-3 py-1 rounded-xl border border-amber-500/30">
                    Review
                  </span>
                </div>
              )}

              {/* QR SCANNER CARD */}
              <div 
                onClick={() => setShowQrModal(true)}
                className="cursor-pointer bg-gradient-to-r from-sky-950/60 to-indigo-950/60 border border-sky-500/30 rounded-3xl p-4 flex items-center justify-between hover:border-sky-400/60 transition shadow-md">
                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center text-xl shadow-md text-white">

                      </div>
                      {r.id === currentMember.id && <span className="text-indigo-400 text-xs font-bold">✓ Active</span>}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: ADD ROOMMATE                                      */}
          {/* ======================================================== */}
          {showAddMemberModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 w-full max-w-md space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-extrabold text-white">Add New Roommate</h3>
                  <button onClick={() => setShowAddMemberModal(false)} className="text-slate-400 hover:text-white text-xl">&times;</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const name = e.target.name.value.trim();
                  const email = e.target.email.value.trim();
                  const colors = ["#6366F1", "#10B981", "#F59E0B", "#EC4899", "#8B5CF6", "#06B6D4"];
                  const pickedColor = colors[roommates.length % colors.length];

                  if (name) {
                    const newMember = {
                      id: "m-" + Date.now(),
                      name,
                      email: email || `${name.toLowerCase().replace(/\s+/g, '.')}@example.com`,
                      phone: "+1 (555) 000-0000",
                      isAdmin: false,
                      color: pickedColor,
                      avatarLetter: name.charAt(0).toUpperCase()
                    };
                    setRoommates(prev => [...prev, newMember]);
                    setShowAddMemberModal(false);
                    showToast(`Added ${name} to room pool!`);
                  }
                }}>
                  <div className="space-y-3">
                    <div>
                      <label className="text-xs text-slate-400 font-semibold block mb-1">Full Name</label>
                      <input type="text" name="name" placeholder="e.g. David Miller" required className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white text-xs font-semibold focus:outline-none focus:border-indigo-500" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 font-semibold block mb-1">Email (Optional)</label>
                      <input type="email" name="email" placeholder="david@example.com" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white text-xs focus:outline-none focus:border-indigo-500" />
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold rounded-xl text-xs transition">
                      Add to Pool
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // ==========================================
    // TRANSACTION ITEM COMPONENT
    // ==========================================
    function TransactionItem({ tx, isAdmin, onApprove, onIgnore, onSettle, onDelete }) {
      const isActionNeeded = !tx.isRoomExpense && !tx.isSettled && tx.approvalStatus !== "IGNORED";

      return (
        <div className="bg-slate-950/90 border border-slate-800/90 rounded-2xl p-3.5 space-y-2 transition hover:border-slate-700 shadow-sm">
          <div className="flex items-start justify-between">
            <div className="space-y-1">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="font-extrabold text-white text-xs sm:text-sm">{tx.title}</span>
                {tx.isRoomExpense ? (
                  <span className="text-[10px] bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-2 py-0.5 rounded-full font-bold">Room Shared</span>
                ) : tx.isSettled ? (
                  <span className="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">✓ Settled</span>
                ) : tx.approvalStatus === "IGNORED" ? (
                  <span className="text-[10px] bg-slate-800 text-slate-400 border border-slate-700 px-2 py-0.5 rounded-full font-bold">Ignored</span>
                ) : (
                  <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full font-bold">⚡ Pending Action</span>
                )}
              </div>
              <p className="text-[11px] text-slate-400">
                Paid by <strong className="text-slate-200">{tx.paidByName}</strong> • {tx.date} • <span className="text-indigo-300">{tx.category}</span>
              </p>
              {tx.note && <p className="text-[11px] text-slate-400 italic">"{tx.note}"</p>}
            </div>

            <div className="text-right">
              <div className={`text-sm sm:text-base font-black ${tx.isRoomExpense ? "text-indigo-400" : "text-slate-200"}`}>
                -${tx.amount.toFixed(2)}
              </div>
            </div>
          </div>

          {/* ACTION CONTROLS: APPROVE, SETTLE, IGNORE */}
          {isActionNeeded && (
            <div className="flex items-center gap-2 pt-2 border-t border-slate-800/80">
              <button 
                onClick={() => onApprove(tx.id)}
                className="flex-1 py-1.5 bg-indigo-600/30 hover:bg-indigo-600 text-indigo-300 hover:text-white border border-indigo-500/40 rounded-xl text-[11px] font-bold transition">
                ✓ Approve as Room
              </button>
              <button 
                onClick={onSettle}
                className="flex-1 py-1.5 bg-emerald-600/30 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/40 rounded-xl text-[11px] font-bold transition">
                ⚡ Settle
              </button>
              <button 
                onClick={() => onIgnore(tx.id)}
                className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white rounded-xl text-[11px] font-semibold transition">
                Ignore
              </button>
            </div>
          )}
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
